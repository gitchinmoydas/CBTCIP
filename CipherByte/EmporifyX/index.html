<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmporifyX</title>
  <link rel="stylesheet" href="styles.css">
  <!-- FontAwesome for cart icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="container">
    <!-- Navigation Bar -->
  <header>
    <nav class="navbar">
      <div class="logo">
        <a href="#">EmporifyX</a>
      </div>
      <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">Products</a></li>
        <li><a href="#">Order Tracking</a></li>
      </ul>

      <!-- Search Bar -->
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search Products..." onkeyup="searchProducts()">
      </div>
       <!-- Cart Icon with item count -->
       <div class="cart-icon" onclick="viewCart()">
        <i class="fas fa-shopping-cart"></i>
        <span id="cartCount" class="cart-count">0</span>
      </div>

      <!-- Login Link -->
      <div class="login-link">
        <a href="#" id="loginLink">Login</a>
      </div>
    </nav>
  </header>

  <!-- Login Modal (Unchanged) -->
  <div id="loginModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" id="closeModal">&times;</span>
      <h2>Login</h2>
      <form id="loginForm">
        <label for="role">Select Role:</label>
        <select id="role" required>
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select><br><br>
        <label for="username">Username:</label>
        <input type="text" id="username" required><br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" required><br><br>
        <button type="submit">Login</button>
      </form>
    </div>
  </div>

    <!-- Product Listing -->
    <section class="product-section">
      <h2>Available Products</h2>
      <div id="productList" class="product-list"></div>
    </section>

    <!-- Shopping Cart -->
    <section class="cart-section">
      <h2>Your Shopping Cart</h2>
      <ul id="cartList" class="cart-list"></ul>
      <div class="cart-summary">
        <p><strong>Total Items:</strong> <span id="totalItems">0</span></p>
        <p><strong>Total Price:</strong> $<span id="totalPrice">0.00</span></p>
        <button id="checkoutBtn" class="checkout-btn">Checkout</button>
      </div>
    </section>

    <!-- Order Tracking -->
    <section class="order-section">
      <h2>Order Tracking</h2>
      <ul id="orderList" class="order-list"></ul>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
